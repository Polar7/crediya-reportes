server:
  port: "${SERVER_PORT:8070}"
spring:
  application:
    name: "reports-microservice"
  devtools:
    add-properties: false
  profiles:
    include: null
entrypoint:
  sqs:
    region: "${AWS_REGION}"
    queueMetricCreditApprovedUrl: "https://sqs.us-east-2.amazonaws.com/575108950970/metric-reports"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
aws:
  dynamodb:
    region: "${AWS_REGION}"
